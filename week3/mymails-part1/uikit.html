<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
 <link href="https://fonts.googleapis.com/css?family=Open+Sans:wght@300" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <title>My Mails</title>
</head>

<body>
  <div id="container-uikit">
    <p class="titre">MY UI KIT</p>
    <div class="section-uikit">
      <div class="card">
        <span class="titre">TYPOGRAPHY</span>
        <div class="content" id="typography">
          <!-- Add your typography here -->
           <h1 class="logo-text">LOGO content</h1>
          </h6>Title content<h6>
            <p>Mail content</p>
         
        </div>
      </div>
      <div class="card">
        <span class="titre">IMAGES</span>
        <div class="content" id="images">
          <!-- Add your images here -->
           <img class="logo" src="images/logomymails.png" />
           <img class="avatar" src="images/avatar-1.jpg" />
           
        </div>
      </div>
    </div>
    <div class="section-uikit">
      <div class="big-card">
        <span class="titre">BUTTONS & INPUTS</span>
        <div class="content" id="buttonsandinputs">
          <!-- Add your buttons and inputs here -->
           <button type="button" id="btn-search">Search</button>
          <span class="delete">x</span>
        <input id="search-message" type="text" placeholder=" search message..." />
        </div>
      </div>
    </div>
  </div>
</body>

</html>
